<!DOCTYPE html>
<html lang="en" class="select-none scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>PlayStash - Console Shell</title>
  
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="favicon.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #070a0f;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 2px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }

    body {
      background-color: #070a0f;
      color: #94a3b8;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    .term-panel {
      background: #0d131d;
      border: 1px solid #1e293b;
    }

    .term-header {
      background: rgba(7, 10, 15, 0.92);
      backdrop-filter: blur(8px);
      padding-top: env(safe-area-inset-top);
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .term-header.scrolled {
      background: rgba(7, 10, 15, 0.98);
      border-bottom-color: #334155;
    }
  </style>
</head>
<body class="bg-[#070a0f] text-slate-400 min-h-screen font-mono flex flex-col antialiased">
  
  <!-- Terminal Top Bar -->
  <header id="main-header" class="term-header border-b border-slate-800 sticky top-0 z-50 px-4 sm:px-6 py-3 flex items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-1.5 mr-1">
        <span class="w-2.5 h-2.5 rounded-full bg-slate-700"></span>
        <span class="w-2.5 h-2.5 rounded-full bg-slate-700"></span>
        <span class="w-2.5 h-2.5 rounded-full bg-slate-700"></span>
      </div>
      <div class="flex items-center gap-2">
        <img src="favicon.png" alt="Logo" class="w-5 h-5 opacity-80" />
        <span class="text-xs font-bold tracking-widest text-slate-200 uppercase">PLAYSTASH<span class="text-slate-500">//</span>TTY1</span>
      </div>
    </div>
    
    <div id="auth-section">
      <button id="login-btn" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium px-3 py-1.5 rounded border border-slate-700 flex items-center gap-2 transition text-xs uppercase tracking-wider active:scale-95">
        <svg class="w-3.5 h-3.5 bg-white rounded-full p-0.5 shrink-0" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>AUTH_GOOGLE</span>
      </button>
      
      <div id="user-profile" class="hidden flex items-center gap-3">
        <img id="user-avatar" class="w-7 h-7 rounded border border-slate-700 object-cover" alt="Profile" />
        <div class="flex flex-col text-right hidden sm:flex">
          <span id="user-email" class="text-xs text-slate-200 font-bold max-w-[150px] truncate"></span>
          <span id="member-since" class="text-[10px] text-slate-500 truncate"></span>
        </div>
        <button id="logout-btn" class="bg-slate-900 hover:bg-slate-800 text-slate-400 hover:text-slate-200 px-2.5 py-1 text-[11px] rounded border border-slate-800 transition">SIG_LOGOUT</button>
      </div>
    </div>
  </header>

  <!-- Console Workspace -->
  <main class="flex-1 max-w-5xl w-full mx-auto p-4 sm:p-6 space-y-6">
    
    <!-- System Telemetry Panel -->
    <div class="term-panel rounded p-4 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <div>
          <div class="text-xs font-bold text-slate-200 uppercase tracking-wider">[SYS_NETWORK_STATUS]</div>
          <div class="text-[11px] text-slate-500">Node sync active · Realtime RTDB</div>
        </div>
      </div>
      
      <div class="flex items-center gap-6 text-xs">
        <div>
          <span class="text-slate-500 block text-[10px] uppercase">Active_Conns</span>
          <span id="online-count" class="text-slate-200 font-bold">0</span>
        </div>
        <div class="h-6 w-[1px] bg-slate-800"></div>
        <div>
          <span class="text-slate-500 block text-[10px] uppercase">Registered_UIDs</span>
          <span id="user-count" class="text-slate-200 font-bold">0</span>
        </div>
      </div>
    </div>

    <!-- Games Matrix -->
    <section>
      <div class="flex items-center justify-between mb-3">
        <h1 class="text-xs font-bold uppercase tracking-widest text-slate-400 flex items-center gap-2">
          <span>&gt; EXEC_TARGETS</span>
        </h1>
        <span class="text-[10px] text-slate-600 uppercase">SYS_MOUNTED</span>
      </div>
      
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4" id="game-grid">
        <a href="game/worldforge/index.html" class="term-panel rounded overflow-hidden hover:border-slate-600 transition group block">
          <div class="h-32 bg-[#05080d] flex items-center justify-center border-b border-slate-800 relative">
            <span class="absolute top-2 left-2 text-[9px] text-slate-600">ID: 0x01</span>
            <img src="favicon.png" class="w-10 h-10 opacity-50 group-hover:opacity-100 transition duration-200" alt="Icon" />
          </div>
          <div class="p-3.5">
            <div class="flex items-center justify-between gap-2">
              <h2 class="font-bold text-xs text-slate-200 group-hover:text-slate-100">WorldForge.exe</h2>
              <span id="game-save-status" class="text-[10px] px-1.5 py-0.5 rounded border bg-slate-900 border-slate-800 text-slate-500">GUEST</span>
            </div>
            <p class="text-[11px] text-slate-500 mt-1.5 leading-relaxed">Civilization sandbox module. Saves bind directly to account state.</p>
          </div>
        </a>
      </div>
    </section>

    <!-- Client Directory -->
    <section class="border-t border-slate-800/60 pt-6">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-xs font-bold uppercase tracking-widest text-slate-400">&gt; USER_DIRECTORY</h2>
        <span class="text-[10px] text-slate-600">FETCHING_PEERS</span>
      </div>
      <div id="users-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2.5">
        <div class="term-panel rounded p-3 text-center text-slate-600 text-xs">
          Reading directory...
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="index.js"></script>
</body>
</html>
