<!DOCTYPE html>
<html lang="en" class="select-none">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>PlayStash - Instant Web Gaming</title>
  
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="favicon.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
    body {
      background: #030712;
      color: #f3f4f6;
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }
    .glass-card {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-nav {
      background: rgba(3, 7, 18, 0.85);
      backdrop-filter: blur(16px);
      padding-top: env(safe-area-inset-top);
    }
    .glow-purple {
      box-shadow: 0 0 25px -5px rgba(168, 85, 247, 0.25);
    }
    .glow-cyan {
      box-shadow: 0 0 25px -5px rgba(6, 182, 212, 0.25);
    }
  </style>
</head>
<body class="bg-[#030712] text-gray-100 min-h-screen font-sans flex flex-col antialiased">
  
  <!-- Header -->
  <header class="glass-nav border-b border-gray-800/80 sticky top-0 z-50 px-4 sm:px-8 py-3.5 flex items-center justify-between gap-4">
    <div class="flex items-center gap-3 cursor-pointer group">
      <div class="relative">
        <div class="absolute -inset-1 bg-gradient-to-r from-cyan-500 to-violet-600 rounded-xl blur opacity-30 group-hover:opacity-75 transition duration-300"></div>
        <img src="favicon.png" alt="PlayStash Logo" class="relative w-8 h-8 rounded-lg object-cover" />
      </div>
      <span class="text-xl font-black tracking-wider text-white">PLAY<span class="bg-gradient-to-r from-cyan-400 to-violet-500 bg-clip-text text-transparent">STASH</span></span>
    </div>
    
    <div id="auth-section">
      <button id="login-btn" class="relative group bg-gradient-to-r from-cyan-500 to-violet-600 hover:from-cyan-400 hover:to-violet-500 text-white font-bold px-4 py-2 rounded-xl flex items-center gap-2.5 transition duration-200 shadow-lg shadow-cyan-500/20 active:scale-95 text-xs sm:text-sm">
        <svg class="w-4 h-4 bg-white rounded-full p-0.5 shrink-0" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Sign in with Google</span>
      </button>
      
      <div id="user-profile" class="hidden flex items-center gap-3">
        <img id="user-avatar" class="w-9 h-9 rounded-full border-2 border-cyan-500/80 object-cover shadow-sm" alt="Profile" />
        <div class="flex flex-col text-right hidden sm:flex">
          <span id="user-email" class="text-xs text-gray-100 font-bold max-w-[150px] truncate"></span>
          <span id="member-since" class="text-[10px] text-cyan-400 font-medium truncate"></span>
        </div>
        <button id="logout-btn" class="bg-gray-800/90 hover:bg-red-500/20 hover:text-red-400 hover:border-red-500/30 text-gray-300 font-semibold px-3 py-1.5 text-xs rounded-xl border border-gray-700/80 transition ml-1 shrink-0">Sign Out</button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-8 space-y-8">
    
    <!-- Live Stats Banner -->
    <div class="glass-card glow-purple rounded-2xl p-5 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3.5">
        <span class="relative flex h-3.5 w-3.5 shrink-0">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-3.5 w-3.5 bg-emerald-500"></span>
        </span>
        <div>
          <h3 class="text-white font-extrabold text-sm tracking-wide">Live Gaming Network</h3>
          <p class="text-xs text-gray-400">Realtime matchmaking & database sync</p>
        </div>
      </div>
      
      <div class="flex items-center gap-6">
        <div class="flex flex-col items-end">
          <span class="text-[10px] font-bold uppercase tracking-wider text-gray-400">Online Now</span>
          <span id="online-count" class="text-xl font-black text-emerald-400">0</span>
        </div>
        <div class="h-8 w-[1px] bg-gray-800"></div>
        <div class="flex flex-col items-end">
          <span class="text-[10px] font-bold uppercase tracking-wider text-gray-400">Total Players</span>
          <span id="user-count" class="text-xl font-black text-cyan-400">0</span>
        </div>
      </div>
    </div>

    <!-- Featured Games Grid -->
    <section>
      <div class="flex items-center justify-between mb-5">
        <h1 class="text-xl sm:text-2xl font-black tracking-tight text-white flex items-center gap-2">
          <span>Trending Arcade</span>
        </h1>
        <span class="text-xs font-semibold px-3 py-1 rounded-full bg-cyan-500/10 text-cyan-400 border border-cyan-500/20">Cloud Saves</span>
      </div>
      
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6" id="game-grid">
        <a href="game/worldforge/index.html" class="glass-card rounded-2xl overflow-hidden hover:border-cyan-500/50 hover:shadow-2xl hover:shadow-cyan-500/10 transition-all duration-300 group block active:scale-[0.99]">
          <div class="h-44 bg-gradient-to-b from-gray-900 to-[#0b101d] flex items-center justify-center relative overflow-hidden">
            <div class="absolute inset-0 bg-gradient-to-tr from-cyan-500/10 to-violet-500/10 opacity-0 group-hover:opacity-100 transition duration-500"></div>
            <img src="favicon.png" class="w-16 h-16 opacity-70 group-hover:opacity-100 group-hover:scale-110 transition duration-300 z-10" alt="Game Icon" />
          </div>
          <div class="p-5">
            <div class="flex items-center justify-between gap-2 flex-wrap">
              <h2 class="font-black text-base text-white group-hover:text-cyan-400 transition">WorldForge</h2>
              <span id="game-save-status" class="text-[10px] font-semibold px-2 py-0.5 rounded-full border shrink-0 bg-amber-500/10 text-amber-400 border-amber-500/20">Sign in to save</span>
            </div>
            <p class="text-xs text-gray-400 mt-1.5 leading-relaxed">Build your custom world & sync progress straight to your profile.</p>
          </div>
        </a>
      </div>
    </section>

    <!-- Signed Up Players Section -->
    <section class="border-t border-gray-800/80 pt-8">
      <div class="flex items-center justify-between mb-5">
        <h2 class="text-lg sm:text-xl font-bold tracking-tight text-white">Active Players</h2>
        <span class="text-xs text-gray-400">Live Player Roster</span>
      </div>
      <div id="users-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        <div class="glass-card rounded-xl p-4 text-center text-gray-400 text-sm">
          Loading active roster...
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="index.js"></script>
</body>
</html>
