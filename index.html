<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlayStash - Instant Web Gaming</title>
  
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="favicon.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #070b14; color: #ffffff; }
    .card-bg { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); }
    .header-bg { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); }
  </style>
</head>
<body class="bg-[#070b14] text-white min-h-screen font-sans flex flex-col selection:bg-blue-500 selection:text-white">
  
  <header class="header-bg border-b border-gray-800/80 sticky top-0 z-50 px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3 cursor-pointer group">
      <img src="favicon.png" alt="PlayStash Logo" class="w-8 h-8 rounded-lg group-hover:scale-105 transition duration-300" />
      <span class="text-xl font-black tracking-wider text-white">PLAY<span class="text-blue-500">STASH</span></span>
    </div>
    
    <div id="auth-section">
      <button id="login-btn" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-4 py-2 rounded-xl flex items-center gap-2 transition duration-200 shadow-lg shadow-blue-600/20 active:scale-95">
        <svg class="w-4 h-4 bg-white rounded-full p-0.5" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Sign in with Google</span>
      </button>
      
      <div id="user-profile" class="hidden flex items-center gap-3">
        <img id="user-avatar" class="w-9 h-9 rounded-full border-2 border-blue-500/80 object-cover shadow-sm" alt="Profile" />
        <div class="flex flex-col text-right">
          <span id="user-email" class="text-xs text-gray-200 font-semibold max-w-[160px] truncate"></span>
          <span id="member-since" class="text-[10px] text-blue-400 font-medium"></span>
        </div>
        <button id="logout-btn" class="bg-gray-800/80 hover:bg-red-500/20 hover:text-red-400 text-gray-300 font-semibold px-3 py-1.5 text-xs rounded-xl border border-gray-700/80 transition ml-1">Sign Out</button>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-6xl w-full mx-auto p-6 space-y-8">
    <!-- Live Stats Banner -->
    <div class="card-bg border border-gray-800/80 rounded-2xl p-5 flex flex-wrap items-center justify-between gap-4 shadow-xl">
      <div class="flex items-center gap-3">
        <span class="relative flex h-3 w-3">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
        </span>
        <div>
          <h3 class="text-white font-bold text-sm tracking-wide">Live Community Network</h3>
          <p class="text-xs text-gray-400">Realtime activity tracking</p>
        </div>
      </div>
      
      <div class="flex items-center gap-6">
        <div class="flex flex-col items-end">
          <span class="text-[11px] font-medium uppercase tracking-wider text-gray-400">Online Now</span>
          <span id="online-count" class="text-xl font-black text-emerald-400 tracking-tight">0</span>
        </div>
        <div class="h-8 w-[1px] bg-gray-800"></div>
        <div class="flex flex-col items-end">
          <span class="text-[11px] font-medium uppercase tracking-wider text-gray-400">Total Registered</span>
          <span id="user-count" class="text-xl font-black text-blue-400 tracking-tight">0</span>
        </div>
      </div>
    </div>

    <!-- Games Grid -->
    <section>
      <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-black tracking-tight text-white">Trending Games</h1>
        <span class="text-xs font-semibold px-3 py-1 rounded-full bg-blue-500/10 text-blue-400 border border-blue-500/20">Instant Play</span>
      </div>
      
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6" id="game-grid">
        <a href="game/worldforge/index.html" class="card-bg border border-gray-800/80 rounded-2xl overflow-hidden hover:border-blue-500/50 hover:shadow-2xl hover:shadow-blue-500/10 transition-all duration-300 cursor-pointer group block">
          <div class="h-44 bg-gradient-to-b from-gray-900 to-[#0d1424] flex items-center justify-center relative overflow-hidden">
            <div class="absolute inset-0 bg-blue-500/5 group-hover:bg-blue-500/10 transition duration-300"></div>
            <img src="favicon.png" class="w-14 h-14 opacity-60 group-hover:opacity-100 group-hover:scale-110 transition duration-300 z-10" alt="Game Icon" />
          </div>
          <div class="p-5">
            <div class="flex items-center justify-between gap-2">
              <h2 class="font-bold text-base text-white group-hover:text-blue-400 transition">WorldForge</h2>
              <span id="game-save-status" class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-gray-800/80 text-gray-400 border border-gray-700/80 shrink-0">Instant Play</span>
            </div>
            <p class="text-xs text-gray-400 mt-1">Build a village · progress saves to your account</p>
          </div>
        </a>
      </div>
    </section>

    <!-- Registered Players Section -->
    <section class="border-t border-gray-800/80 pt-8">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-bold tracking-tight text-white">Signed Up Players</h2>
        <span class="text-xs text-gray-400">Live Database Sync</span>
      </div>
      <div id="users-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        <div class="card-bg border border-gray-800/80 rounded-xl p-4 text-center text-gray-400 text-sm">
          Loading player network...
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="index.js"></script>
</body>
</html>
