<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord Community Card</title>
  <style>
    :root {
      --discord-blurple: #5865F2;
      --discord-hover: #4752C4;
      --discord-green: #23A55A;
      --bg-card: #1e1f22;
      --bg-inner: #2b2d31;
      --text-muted: #949ba4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'gg sans', 'Noto Sans', system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111214;
      perspective: 1000px;
    }

    /* Card Shell with Glow & Tilt */
    .discord-card {
      position: relative;
      width: 360px;
      background: var(--bg-card);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5),
                  0 0 0 1px rgba(255, 255, 255, 0.05);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease;
    }

    .discord-card:hover {
      transform: translateY(-8px) rotateX(4deg) rotateY(-2deg);
      box-shadow: 0 20px 40px rgba(88, 101, 242, 0.25),
                  0 0 20px rgba(88, 101, 242, 0.15),
                  0 0 0 1px rgba(88, 101, 242, 0.4);
    }

    /* Banner Image */
    .banner {
      height: 100px;
      background: linear-gradient(135deg, #5865F2, #eb459e, #7289da);
      background-size: 200% 200%;
      animation: gradientMove 8s ease infinite;
      position: relative;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Server Avatar */
    .avatar-wrapper {
      position: absolute;
      bottom: -24px;
      left: 20px;
    }

    .avatar {
      width: 68px;
      height: 68px;
      border-radius: 20px;
      background: var(--bg-card);
      padding: 6px;
      position: relative;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      border-radius: 14px;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .discord-card:hover .avatar img {
      transform: scale(1.08) rotate(-4deg);
    }

    .status-badge {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 16px;
      height: 16px;
      background: var(--discord-green);
      border: 3px solid var(--bg-card);
      border-radius: 50%;
    }

    .status-badge::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: var(--discord-green);
      opacity: 0.6;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(1.8); opacity: 0; }
    }

    /* Content Area */
    .content {
      padding: 36px 20px 20px;
    }

    .server-name {
      color: #ffffff;
      font-size: 20px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .verified-icon {
      color: var(--discord-blurple);
      width: 18px;
      height: 18px;
    }

    .server-desc {
      color: var(--text-muted);
      font-size: 13px;
      margin-top: 6px;
      line-height: 1.4;
    }

    /* Live Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 16px 0;
    }

    .stat-card {
      background: var(--bg-inner);
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.03);
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .stat-card:hover {
      background: rgba(255, 255, 255, 0.06);
      transform: translateY(-2px);
    }

    .stat-header {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .stat-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .stat-dot.online { background: var(--discord-green); }
    .stat-dot.members { background: var(--text-muted); }

    .stat-value {
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      margin-top: 4px;
    }

    /* Tags / Topics */
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 20px;
    }

    .tag {
      background: rgba(88, 101, 242, 0.12);
      color: #a4adff;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 6px;
    }

    /* Action Buttons */
    .actions {
      display: flex;
      gap: 10px;
    }

    .btn-join {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      background: var(--discord-blurple);
      color: #ffffff;
      font-weight: 600;
      font-size: 14px;
      text-decoration: none;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(88, 101, 242, 0.3);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      overflow: hidden;
    }

    .btn-join::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        60deg,
        transparent,
        rgba(255, 255, 255, 0.2),
        transparent
      );
      transform: rotate(30deg) translateY(-100%);
      transition: transform 0.6s ease;
    }

    .btn-join:hover::before {
      transform: rotate(30deg) translateY(100%);
    }

    .btn-join:hover {
      background: var(--discord-hover);
      transform: scale(1.02);
      box-shadow: 0 6px 20px rgba(88, 101, 242, 0.5);
    }

    .btn-join svg {
      transition: transform 0.3s ease;
    }

    .btn-join:hover svg {
      transform: rotate(-12deg) scale(1.15);
    }

    .btn-share {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-inner);
      color: var(--text-muted);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-share:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.1);
      transform: scale(1.05);
    }

    /* Toast Notification */
    .toast {
      position: absolute;
      bottom: -40px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--discord-green);
      color: white;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 20px;
      opacity: 0;
      transition: all 0.3s ease;
      pointer-events: none;
    }

    .toast.show {
      bottom: 12px;
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="discord-card">
    <div class="banner">
      <div class="avatar-wrapper">
        <div class="avatar">
          <img src="https://assets-global.website-files.com/6257adef93867e50d84d30e2/636e0a6a49cf127bf92de1e2_icon_clyde_blurple_RGB.png" alt="Server Avatar">
          <div class="status-badge"></div>
        </div>
      </div>
    </div>

    <div class="content">
      <div class="server-name">
        Dev Lounge
        <svg class="verified-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
        </svg>
      </div>
      <p class="server-desc">The ultimate hub for developers, designers, and tech enthusiasts. Code, share, and hang out!</p>

      <!-- Live Data Stats -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-header">
            <span class="stat-dot online"></span> Online
          </div>
          <div class="stat-value" id="onlineCount">1,420</div>
        </div>
        <div class="stat-card">
          <div class="stat-header">
            <span class="stat-dot members"></span> Members
          </div>
          <div class="stat-value" id="memberCount">8,950</div>
        </div>
      </div>

      <!-- Feature Tags -->
      <div class="tags">
        <span class="tag"># coding</span>
        <span class="tag"># showcase</span>
        <span class="tag"># voice-chat</span>
        <span class="tag"># giveaways</span>
      </div>

      <!-- Actions -->
      <div class="actions">
        <a href="https://discord.gg" target="_blank" class="btn-join">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028z"/>
          </svg>
          Join Server
        </a>
        <button class="btn-share" id="shareBtn" title="Copy Invite Link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
          </svg>
        </button>
      </div>
    </div>

    <div class="toast" id="toast">Invite link copied!</div>
  </div>

  <script>
    // Copy Invite Link Interactivity
    const shareBtn = document.getElementById('shareBtn');
    const toast = document.getElementById('toast');

    shareBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(window.location.href);
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    });

    // Simulated Dynamic Member Counter Effect on Load
    function animateValue(id, start, end, duration) {
      const obj = document.getElementById(id);
      let startTimestamp = null;
      const step = (timestamp) => {
        if (!startTimestamp) startTimestamp = timestamp;
        const progress = Math.min((timestamp - startTimestamp) / duration, 1);
        const current = Math.floor(progress * (end - start) + start);
        obj.innerHTML = current.toLocaleString();
        if (progress < 1) {
          window.requestAnimationFrame(step);
        }
      };
      window.requestAnimationFrame(step);
    }

    animateValue("onlineCount", 1200, 1420, 1500);
    animateValue("memberCount", 8500, 8950, 1500);
  </script>

</body>
</html>
