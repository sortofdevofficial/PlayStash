<!DOCTYPE html>
<html lang="en" class="select-none scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>PlayStash - Instant Web Gaming</title>
  
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="favicon.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    /* Custom Console Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #030712;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 4px;
      border: 1px solid #334155;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #2563eb;
    }

    body {
      background-color: #030712;
      background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 24px 24px;
      color: #e2e8f0;
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    .console-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(51, 65, 85, 0.6);
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.5);
    }

    .console-nav {
      background: rgba(3, 7, 18, 0.85);
      backdrop-filter: blur(16px);
      padding-top: env(safe-area-inset-top);
      transition: border-color 0.3s ease, background 0.3s ease;
    }

    .console-nav.scrolled {
      background: rgba(3, 7, 18, 0.95);
      border-bottom-color: rgba(37, 99, 235, 0.4);
    }
  </style>
</head>
<body class="bg-[#030712] text-slate-200 min-h-screen font-sans flex flex-col antialiased">
  
  <!-- Console Header -->
  <header id="main-header" class="console-nav border-b border-slate-800/80 sticky top-0 z-50 px-4 sm:px-8 py-3.5 flex items-center justify-between gap-4">
    <div class="flex items-center gap-3 cursor-pointer group">
      <div class="p-1 rounded-lg bg-slate-900 border border-slate-700/80 group-hover:border-blue-500/50 transition">
        <img src="favicon.png" alt="PlayStash Logo" class="w-7 h-7 rounded object-cover" />
      </div>
      <div class="flex flex-col">
        <span class="text-base sm:text-lg font-black tracking-widest text-white uppercase font-mono">PLAY<span class="text-blue-500">STASH</span></span>
        <span class="text-[9px] font-mono text-slate-500 tracking-wider uppercase -mt-1">OS v2.4</span>
      </div>
    </div>
    
    <div id="auth-section">
      <button id="login-btn" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-4 py-2 rounded-lg flex items-center gap-2.5 transition duration-200 border border-blue-400/30 active:scale-95 text-xs uppercase tracking-wider font-mono">
        <svg class="w-4 h-4 bg-white rounded-full p-0.5 shrink-0" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Google Auth</span>
      </button>
      
      <div id="user-profile" class="hidden flex items-center gap-3">
        <img id="user-avatar" class="w-8 h-8 rounded-full border border-blue-500/60 object-cover" alt="Profile" />
        <div class="flex flex-col text-right hidden sm:flex">
          <span id="user-email" class="text-xs text-slate-200 font-bold max-w-[140px] truncate"></span>
          <span id="member-since" class="text-[10px] text-blue-400 font-mono truncate"></span>
        </div>
        <button id="logout-btn" class="bg-slate-800 hover:bg-red-500/20 hover:text-red-400 hover:border-red-500/40 text-slate-300 font-mono font-semibold px-3 py-1 text-xs rounded border border-slate-700 transition ml-1 shrink-0">Sign Out</button>
      </div>
    </div>
  </header>

  <!-- Main Console Body -->
  <main class="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-8 space-y-8">
    
    <!-- System Telemetry Status -->
    <div class="console-card rounded-xl p-4 sm:p-5 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3.5">
        <span class="relative flex h-3 w-3 shrink-0">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
        </span>
        <div>
          <h3 class="text-white font-bold text-xs uppercase tracking-widest font-mono">Network Status: Online</h3>
          <p class="text-[11px] text-slate-400 font-mono">Realtime telemetry & player grid sync</p>
        </div>
      </div>
      
      <div class="flex items-center gap-6 font-mono">
        <div class="flex flex-col items-end">
          <span class="text-[9px] font-bold uppercase tracking-wider text-slate-500">Active Sessions</span>
          <span id="online-count" class="text-lg font-bold text-emerald-400">0</span>
        </div>
        <div class="h-6 w-[1px] bg-slate-800"></div>
        <div class="flex flex-col items-end">
          <span class="text-[9px] font-bold uppercase tracking-wider text-slate-500">Registered Accounts</span>
          <span id="user-count" class="text-lg font-bold text-blue-400">0</span>
        </div>
      </div>
    </div>

    <!-- Games Library -->
    <section>
      <div class="flex items-center justify-between mb-4">
        <h1 class="text-base sm:text-lg font-bold uppercase tracking-wider text-white font-mono flex items-center gap-2">
          <span class="w-2 h-2 bg-blue-500 rounded-full inline-block"></span>
          <span>Game Library</span>
        </h1>
        <span class="text-[10px] font-mono uppercase font-semibold px-2.5 py-0.5 rounded bg-slate-900 text-slate-400 border border-slate-800">System Verified</span>
      </div>
      
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-5" id="game-grid">
        <a href="game/worldforge/index.html" class="console-card rounded-xl overflow-hidden hover:border-blue-500/60 transition-all duration-300 group block">
          <div class="h-40 bg-slate-950 flex items-center justify-center relative overflow-hidden border-b border-slate-800/80">
            <img src="favicon.png" class="w-14 h-14 opacity-60 group-hover:opacity-100 group-hover:scale-105 transition duration-300 z-10" alt="Game Icon" />
          </div>
          <div class="p-4">
            <div class="flex items-center justify-between gap-2 flex-wrap">
              <h2 class="font-bold text-sm text-white group-hover:text-blue-400 transition font-mono">WorldForge</h2>
              <span id="game-save-status" class="text-[10px] font-mono px-2 py-0.5 rounded border shrink-0 bg-slate-900 text-slate-400 border-slate-800">Sign in to save</span>
            </div>
            <p class="text-xs text-slate-400 mt-2 leading-relaxed">Sandbox civilization builder with cloud state synchronization.</p>
          </div>
        </a>
      </div>
    </section>

    <!-- Player Registry -->
    <section class="border-t border-slate-800/80 pt-8">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-sm font-bold uppercase tracking-wider text-white font-mono">Player Directory</h2>
        <span class="text-[10px] font-mono text-slate-500 uppercase">Live Database</span>
      </div>
      <div id="users-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
        <div class="console-card rounded-lg p-4 text-center text-slate-400 text-xs font-mono">
          Syncing roster...
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="index.js"></script>
</body>
</html>
