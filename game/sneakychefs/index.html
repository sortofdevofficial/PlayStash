<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sneaky Chefs: Kitchen Escape</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d0d11;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #game-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* HUD Overlay */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }
        .hud-card {
            background: rgba(18, 18, 28, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px 20px;
            border-radius: 12px;
            color: #ffffff;
            font-weight: 700;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        /* Graphics quality toggle */
        #gfx-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
            background: rgba(18, 18, 28, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            font-weight: 700;
            font-size: 0.85rem;
            padding: 10px 16px;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }
        #gfx-toggle:active { transform: translateY(1px); }
        #gfx-toggle.low { background: rgba(255, 184, 0, 0.22); border-color: rgba(255, 184, 0, 0.5); }

        /* Toast Notifications */
        #toast {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(20, 20, 30, 0.9);
            border-left: 5px solid #ffcc00;
            color: #fff;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            z-index: 10;
        }
        #toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Game Over / Win Modal */
        .modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 100;
        }
        .modal.show {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-card {
            background: #181824;
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 420px;
            width: 90%;
            color: #fff;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }
        .modal-card h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            color: #ff4757;
        }
        .modal-card h1.win {
            color: #2ed573;
        }
        .modal-card p {
            color: #a4b0be;
            margin-bottom: 25px;
            font-size: 1rem;
        }
        .btn {
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 71, 87, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(255, 71, 87, 0.6);
        }

        /* Mobile Touch Controls */
        #touch-controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            height: 140px;
            display: flex;
            justify-content: space-between;
            padding: 0 25px;
            pointer-events: none;
            z-index: 10;
        }
        .dpad, .action-btns {
            pointer-events: auto;
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .touch-btn {
            width: 65px;
            height: 65px;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: manipulation;
        }
        .touch-btn:active {
            background: rgba(255,255,255,0.35);
        }

        @media (min-width: 768px) {
            #touch-controls { display: none; }
        }
    </style>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <button id="gfx-toggle">LOW GRAPHICS: OFF</button>
    <div id="toast">Message</div>

    <div id="game-over-modal" class="modal">
        <div class="modal-card">
            <h1 id="modal-title">CAUGHT!</h1>
            <p id="modal-desc">The Chef caught you stealing his ingredients.</p>
            <button class="btn" id="restart-btn">RESTART NOW</button>
        </div>
    </div>

    <div id="touch-controls">
        <div class="dpad">
            <div class="touch-btn" id="btn-left">◄</div>
            <div style="display:flex; flex-direction:column; gap:12px;">
                <div class="touch-btn" id="btn-up">▲</div>
                <div class="touch-btn" id="btn-down">▼</div>
            </div>
            <div class="touch-btn" id="btn-right">►</div>
        </div>
        <div class="action-btns">
            <div class="touch-btn" id="btn-jump" style="width:75px; height:75px; background:rgba(255,71,87,0.4);">JUMP</div>
        </div>
    </div>

    <canvas id="game-canvas"></canvas>

    <!-- Split Modules (index.js holds shared state + main loop, so it loads last) -->
    <script src="models/mice.js"></script>
    <script src="models/chef.js"></script>
    <script src="environment.js"></script>
    <script src="chef-ai.js"></script>
    <script src="mouse-controller.js"></script>
    <script src="index.js"></script>
</body>
</html>
