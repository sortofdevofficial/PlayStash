<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sneaky Chefs: Kitchen Escape</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d0d11;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #game-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        #map-container {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            background: #1a1a24;
        }
        #mapCanvas {
            width: 130px;
            height: 130px;
            display: block;
        }

        #inventory {
            background: rgba(18, 18, 28, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 10px 12px 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            color: #fff;
        }
        .inv-title {
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #a4b0be;
            margin-bottom: 8px;
        }
        .inv-grid {
            display: grid;
            grid-template-columns: repeat(4, 50px);
            gap: 6px;
        }
        .inv-slot {
            position: relative;
            width: 50px;
            height: 50px;
            border-radius: 9px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
        }
        .inv-slot.filled {
            background: rgba(255, 184, 0, 0.16);
            border-color: rgba(255, 184, 0, 0.55);
        }

        #interact-prompt {
            position: absolute;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%) scale(0.9);
            background: rgba(255, 184, 0, 0.92);
            color: #111;
            padding: 12px 26px;
            border-radius: 30px;
            font-weight: 800;
            font-size: 1.1rem;
            box-shadow: 0 10px 25px rgba(255, 184, 0, 0.4);
            opacity: 0;
            pointer-events: none;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
        }
        #interact-prompt.show {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }

        .modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 100;
        }
        .modal.show {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-card {
            background: #181824;
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 420px;
            width: 90%;
            color: #fff;
        }
        .modal-card h1 { font-size: 2.2rem; margin-bottom: 10px; color: #ff4757; }
        .modal-card p { color: #a4b0be; margin-bottom: 25px; }

        #touch-controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            height: 140px;
            display: flex;
            justify-content: space-between;
            padding: 0 25px;
            pointer-events: none;
            z-index: 10;
        }
        .dpad, .action-btns {
            pointer-events: auto;
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .touch-btn {
            width: 65px;
            height: 65px;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            color: white;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @media (min-width: 768px) { #touch-controls { display: none; } }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="hud">
        <div id="inventory">
            <div class="inv-title">INVENTORY <span class="inv-hint">[I]</span></div>
            <div class="inv-grid" id="inv-grid"></div>
        </div>
    </div>

    <div id="map-container">
        <canvas id="mapCanvas" width="130" height="130"></canvas>
    </div>

    <div id="interact-prompt">Press [E] to Hide in Cardboard Box</div>

    <div id="game-over-modal" class="modal">
        <div class="modal-card">
            <h1 id="modal-title">CAUGHT!</h1>
            <p id="modal-desc">The Chef caught you!</p>
        </div>
    </div>

    <div id="touch-controls">
        <div class="dpad">
            <div class="touch-btn" id="btn-left">◄</div>
            <div style="display:flex; flex-direction:column; gap:12px;">
                <div class="touch-btn" id="btn-up">▲</div>
                <div class="touch-btn" id="btn-down">▼</div>
            </div>
            <div class="touch-btn" id="btn-right">►</div>
        </div>
        <div class="action-btns">
            <div class="touch-btn" id="btn-interact">📦</div>
            <div class="touch-btn" id="btn-jump" style="width:75px; height:75px; background:rgba(255,71,87,0.4);">JUMP</div>
        </div>
    </div>

    <canvas id="game-canvas"></canvas>

    <script src="models/mice.js"></script>
    <script src="models/chef.js"></script>
    <script src="map.js"></script>
    <script src="environment.js"></script>
    <script src="food.js"></script>
    <script src="mouse-controller.js"></script>
    <script src="index.js"></script>
</body>
</html>
